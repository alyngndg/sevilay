<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heppi börtdeyy</title>
  <!-- Google Fonts: Urbanist ve DM Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFDCE8;
      --text-pink: #C2185B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-pink);
      font-family: 'Urbanist', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    /* Kalp Uçuşma Efekti (SVG Kalpler) */
    .heart-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      fill: var(--text-pink);
      opacity: 0.6;
      animation: floatUp 5s infinite ease-in;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-115vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Sayfa Yapısı */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
      transform: translateY(10px);
      z-index: 2;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Metin Sitilleri */
    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1.3;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .message {
      font-size: 1.3rem;
      line-height: 1.7;
      max-width: 650px;
      margin-bottom: 30px;
      font-weight: 500;
    }

    /* Tıklanabilir Yazı Butonlar */
    .clickable-text {
      background: none;
      border: none;
      color: var(--text-pink);
      font-family: 'DM Mono', monospace;
      font-size: 1.2rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 6px;
      transition: opacity 0.2s ease, transform 0.2s ease;
      padding: 10px 20px;
    }

    .clickable-text:hover {
      opacity: 0.75;
      transform: scale(1.03);
    }

    /* YouTube Video Alanı */
    .video-container {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      margin-top: 10px;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* İmza */
    .signature {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      color: var(--text-pink);
      z-index: 10;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .message {
        font-size: 1.1rem;
      }
      .clickable-text {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <!-- Yüzen Kalpler (SVG) -->
  <div class="heart-container" id="heartContainer"></div>

  <!-- Sayfa 1 -->
  <div class="screen active" id="screen1">
    <h1>İYİ Kİ DOĞDUN AŞKKUŞUMM</h1>
    <button class="clickable-text" onclick="goToScreen(2)">tıkla</button>
  </div>

  <!-- Sayfa 2 -->
  <div class="screen" id="screen2">
    <p class="message">
      bilseydim önceden hazırlardım kütüphanede yaptım bunu ahakehjawn😭 seni çok seviyorum ne kadar çabaladığını uğraştığını biliyorum kazanacağına da eminim iyi ki doğmuşsun🥹
    </p>
    <button class="clickable-text" onclick="goToScreen(3)">doğum günü şarkın için tıkla</button>
  </div>

  <!-- Sayfa 3 -->
  <div class="screen" id="screen3">
    <div class="video-container">
      <iframe 
        src="https://www.youtube.com/embed/623o8kMXabA?autoplay=1" 
        title="Doğum Günü Şarkısı" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <!-- Sabit İmza -->
  <div class="signature">-Aley</div>

  <script>
    // Kalp Oluşturma Fonksiyonu
    const heartContainer = document.getElementById('heartContainer');
    
    function createHeart() {
      const heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      heart.setAttribute("viewBox", "0 0 24 24");
      heart.classList.add("heart");
      
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z");
      
      heart.appendChild(path);

      const size = Math.random() * 25 + 15;
      const left = Math.random() * 100;
      const duration = Math.random() * 3 + 4;
      const delay = Math.random() * 2;

      heart.style.width = `${size}px`;
      heart.style.height = `${size}px`;
      heart.style.left = `${left}vw`;
      heart.style.animationDuration = `${duration}s`;
      heart.style.animationDelay = `${delay}s`;

      heartContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, (duration + delay) * 1000);
    }

    setInterval(createHeart, 300);
    for(let i = 0; i < 10; i++) {
      createHeart();
    }

    // Sayfa Geçiş Fonksiyonu
    function goToScreen(screenNumber) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => s.classList.remove('active'));
      
      const targetScreen = document.getElementById(`screen${screenNumber}`);
      if(targetScreen) {
        targetScreen.classList.add('active');
      }
    }
  </script>
</body>
</html>
